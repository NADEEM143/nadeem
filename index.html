<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NADIM PDF | Elite Document Intelligence</title>
    <style>
        /* --- ELITE PREMIUM DESIGN SYSTEM --- */
        :root {
            --brand-accent: #6366f1;
            --midnight: #020617;
            --slate-pro: #0f172a;
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-dim: #94a3b8;
            --whatsapp-green: #25D366;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--midnight); color: var(--text-primary); min-height: 100vh; -webkit-font-smoothing: antialiased; }

        nav { background: rgba(2, 6, 23, 0.7); backdrop-filter: blur(20px); padding: 20px 80px; border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .logo-wrap { display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .logo-icon { width: 42px; height: 42px; background: linear-gradient(135deg, var(--brand-accent), #4338ca); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 22px; color: white; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); }
        .logo-text { font-size: 24px; font-weight: 800; letter-spacing: -1.5px; }
        .logo-text span { opacity: 0.5; font-weight: 400; }

        .hero { padding: 100px 20px 60px; text-align: center; }
        .hero h1 { font-size: 64px; font-weight: 900; letter-spacing: -3px; line-height: 1.1; background: linear-gradient(to bottom, #fff 40%, #64748b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .tool-grid { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 0 40px 100px; }
        .card { background: var(--slate-pro); padding: 40px 30px; border-radius: 32px; border: 1px solid var(--glass-border); cursor: pointer; transition: 0.4s; height: 100%; }
        .card:hover { transform: translateY(-10px); border-color: var(--brand-accent); background: rgba(15, 23, 42, 0.8); }
        
        .contact-footer { padding: 60px 40px; border-top: 1px solid var(--glass-border); text-align: center; background: rgba(15, 23, 42, 0.3); }
        .contact-wrap { max-width: 600px; margin: 0 auto; }
        .contact-title { font-size: 24px; font-weight: 800; margin-bottom: 10px; }
        .contact-link { color: var(--brand-accent); font-weight: 700; text-decoration: none; font-size: 22px; transition: 0.3s; display: block; margin-bottom: 20px; }
        
        .whatsapp-btn { display: inline-flex; align-items: center; gap: 12px; background: var(--whatsapp-green); color: white; padding: 14px 30px; border-radius: 50px; font-weight: 800; text-decoration: none; font-size: 14px; transition: 0.4s; }
        .whatsapp-btn:hover { transform: translateY(-5px); filter: brightness(1.1); }

        #overlay { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(25px); z-index: 200; display: none; align-items: center; justify-content: center; overflow-y: auto; padding: 20px; }
        .modal-box { background: var(--slate-pro); width: 100%; max-width: 650px; border-radius: 40px; padding: 50px; border: 1px solid var(--glass-border); text-align: center; }

        .config-section { margin-top: 30px; padding-top: 30px; border-top: 1px solid var(--glass-border); }
        .section-label { font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--brand-accent); margin-bottom: 20px; display: block; }
        
        .review-window { padding: 20px; border-radius: 24px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); min-height: 150px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .review-window img { max-width: 100%; max-height: 250px; border-radius: 12px; object-fit: contain; }

        .cta-btn { background: #fff; color: var(--midnight); width: 100%; padding: 22px; border: none; border-radius: 18px; font-weight: 900; cursor: pointer; margin-top: 25px; transition: 0.3s; font-size: 16px; }
        .cta-btn:hover { background: var(--brand-accent); color: white; }
        .cta-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        #status { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--brand-accent); color: #fff; padding: 18px 40px; border-radius: 100px; display: none; font-weight: 800; z-index: 300; }
    </style>
</head>
<body>
    <nav>
        <div class="logo-wrap" onclick="location.reload()">
            <div class="logo-icon">N</div>
            <div class="logo-text">NADIM<span>PDF</span></div>
        </div>
        <div style="font-size: 10px; font-weight: 800; letter-spacing: 2px; color: var(--brand-accent); text-transform: uppercase;">PRO EDITION</div>
    </nav>

    <div class="hero"><h1>Intelligent Document <br>Engineering.</h1></div>

    <div class="tool-grid">
        <div class="card" onclick="runTool('imagepdf')"><h3>Image Consolidation</h3></div>
        <div class="card" onclick="runTool('officepdf')"><h3>Word to PDF</h3></div>
        <div class="card" onclick="runTool('pdfword')"><h3>PDF to Word</h3></div>
        <div class="card" onclick="runTool('compress')"><h3>Neural Compression</h3></div>
    </div>

    <footer class="contact-footer">
        <div class="contact-wrap">
            <h3 class="contact-title">Need Technical Support?</h3>
            <p style="color: var(--text-dim); margin-bottom: 20px;">Our engineering team is ready to assist.</p>
            <a href="tel:9718439786" class="contact-link">+91 9718439786</a>
            <a href="https://wa.me" target="_blank" class="whatsapp-btn">Chat on WhatsApp</a>
        </div>
    </footer>

    <div id="overlay">
        <div class="modal-box">
            <h2 id="modalTitle" style="font-weight: 900; font-size: 32px; letter-spacing: -1px;">Configuration</h2>
            <div id="mergeConfig" class="config-section" style="display:none;">
                <button class="cta-btn" onclick="setMergeAxis('horizontal')" style="width:48%; margin-right:2%">Horizontal</button>
                <button class="cta-btn" onclick="setMergeAxis('vertical')" style="width:48%">Vertical</button>
            </div>
            <div class="config-section">
                <div class="review-window" id="reviewContainer"><p id="fileName" style="color: var(--text-dim); font-weight: 700;">READY</p></div>
            </div>
            <button class="cta-btn" id="finalAction">Commit & Execute Engine</button>
            <p onclick="closeModal()" style="text-align:center; margin-top:20px; cursor:pointer; font-size:12px; color:var(--text-dim); font-weight: 800;">CANCEL SESSION</p>
        </div>
    </div>

    <input type="file" id="filePicker" style="display:none" multiple>
    <canvas id="mergeCanvas" style="display:none;"></canvas>
    <div id="status">NADIM ENGINE ACTIVE</div>

    <script>
        const picker = document.getElementById('filePicker'), 
              status = document.getElementById('status'), 
              overlay = document.getElementById('overlay'), 
              reviewContainer = document.getElementById('reviewContainer'), 
              canvas = document.getElementById('mergeCanvas'), 
              ctx = canvas.getContext('2d'),
              actionBtn = document.getElementById('finalAction');
              
        let currentTool = "", selectedFileList = [], mergeAxis = "horizontal", processedBlob = null, isReady = false, task = null;

        function runTool(tool) { currentTool = tool; picker.value = ""; picker.click(); }
        function closeModal() { 
            overlay.style.display = 'none'; status.style.display = 'none'; isReady = false; 
            actionBtn.innerText = "Commit & Execute Engine"; actionBtn.disabled = false;
            actionBtn.style.background = "#fff"; actionBtn.style.color = "#020617";
        }

        picker.onchange = async function() {
            if (this.files.length > 0) {
                selectedFileList = this.files;
                overlay.style.display = 'flex';
                document.getElementById('fileName').innerText = selectedFileList[0].name;
                document.getElementById('mergeConfig').style.display = currentTool === 'imagepdf' ? 'block' : 'none';
                if (currentTool === 'imagepdf') await generateMergePreview();
                else reviewContainer.innerHTML = `<div style="text-align:center"><p style="color:var(--brand-accent);font-weight:800;font-size:14px">READY FOR PROCESSING</p><p style="color:var(--text-dim);font-size:12px;margin-top:5px">${selectedFileList[0].name}</p></div>`;
            }
        };

        async function generateMergePreview() {
            const imgs = await Promise.all(Array.from(selectedFileList).map(f => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = URL.createObjectURL(f); })));
            canvas.width = imgs.reduce((s, i) => s + i.width, 0); canvas.height = Math.max(...imgs.map(i => i.height));
            let o = 0; imgs.forEach(i => { ctx.drawImage(i, o, 0); o += i.width; });
            canvas.toBlob(b => { processedBlob = b; reviewContainer.innerHTML = `<img src="${URL.createObjectURL(b)}" style="max-width:100%; border-radius:12px">`; }, 'image/jpeg', 0.9);
        }

        actionBtn.onclick = async function() {
            if (isReady && task) { window.location.href = `https://${task.server}/v1/download/${task.task}`; setTimeout(closeModal, 2000); return; }
            if (selectedFileList.length === 0 && !processedBlob) return;

            status.style.display = 'block'; status.innerText = "ENGAGING ENGINE...";
            actionBtn.disabled = true;

            try {
                // FIXED binary selection
                const binary = (currentTool === 'imagepdf' && processedBlob) ? processedBlob : selectedFileList[0];
                const handshakeFd = new FormData(); handshakeFd.append('tool', currentTool);
                
                const res = await fetch('/api/process', { method: 'POST', body: handshakeFd });
                task = await res.json();

                if (task.status === "SUCCESS") {
                    status.innerText = "UPLOADING...";
                    const uploadFd = new FormData(); uploadFd.append('task', task.task); uploadFd.append('file', binary);
                    await fetch(`https://${task.server}/v1/upload`, { method: 'POST', headers: { 'Authorization': `Bearer ${task.token}` }, body: uploadFd });

                    status.innerText = "CONVERTING...";
                    // SYNC Logic: Match Technical Tool ID from handshake
                    const toolToProcess = currentTool === 'pdfword' ? 'pdfocr' : currentTool;
                    const procFd = new FormData(); procFd.append('task', task.task); procFd.append('tool', toolToProcess);
                    
                    const procRes = await fetch(`https://${task.server}/v1/process`, { 
                        method: 'POST', 
                        headers: { 'Authorization': `Bearer ${task.token}` }, 
                        body: procFd 
                    });

                    if (procRes.ok) {
                        status.innerText = "PROCESS COMPLETE"; isReady = true; actionBtn.disabled = false;
                        actionBtn.innerText = "DOWNLOAD PROCESSED FILE"; actionBtn.style.background = "#6366f1"; actionBtn.style.color = "#fff";
                    } else { throw new Error(); }
                }
            } catch (err) { status.innerText = "ENGINE ERROR: RETRY"; actionBtn.disabled = false; }
        };
    </script>
</body>
</html>
