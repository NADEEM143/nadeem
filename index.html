<p onclick="closeModal()" style="text-align:center; margin-top:20px; cursor:pointer; font-size:12px; color:var(--text-dim); font-weight: 800;">CANCEL SESSION</p>
        </div>
    </div>

    <input type="file" id="filePicker" style="display:none" multiple>
    <canvas id="mergeCanvas" style="display:none;"></canvas>
    <div id="status">NADIM ENGINE ACTIVE</div>

    <script>
        const picker = document.getElementById('filePicker'), 
              status = document.getElementById('status'), 
              overlay = document.getElementById('overlay'), 
              reviewContainer = document.getElementById('reviewContainer'), 
              canvas = document.getElementById('mergeCanvas'), 
              ctx = canvas.getContext('2d');
              
        let currentTool = "", selectedFileList = [], mergeAxis = "horizontal", processedBlob = null;

        function runTool(tool) { 
            currentTool = tool; picker.value = ""; 
            if (tool === 'officepdf') picker.accept = ".doc,.docx";
            else if (tool === 'imagepdf') picker.accept = "image/*";
            else picker.accept = ".pdf";
            picker.click(); 
        }

        function closeModal() { overlay.style.display = 'none'; picker.value = ""; processedBlob = null; }

        async function setMergeAxis(axis) { 
            mergeAxis = axis; 
            if (currentTool === 'imagepdf') await generateMergePreview(); 
        }

        picker.onchange = async function() {
            selectedFileList = this.files;
            if (selectedFileList.length > 0) {
                overlay.style.display = 'flex';
                document.getElementById('mergeConfig').style.display = currentTool === 'imagepdf' ? 'block' : 'none';
                if (currentTool === 'imagepdf') {
                    selectedFileList = Array.from(this.files).slice(0, 100);
                    await generateMergePreview();
                } else {
                    reviewContainer.innerHTML = `<div style="text-align:center"><p style="color:var(--brand-accent);font-weight:800;font-size:14px">READY FOR PROCESSING</p><p style="color:var(--text-dim);font-size:12px;margin-top:5px">${selectedFileList[0].name}</p></div>`;
                }
            }
        };

        async function generateMergePreview() {
            const imgs = await Promise.all(Array.from(selectedFileList).map(f => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = URL.createObjectURL(f); })));
            if (mergeAxis === 'horizontal') {
                canvas.width = imgs.reduce((s, i) => s + i.width, 0); canvas.height = Math.max(...imgs.map(i => i.height));
                let o = 0; imgs.forEach(i => { ctx.drawImage(i, o, 0); o += i.width; });
            } else {
                canvas.width = Math.max(...imgs.map(i => i.width)); canvas.height = imgs.reduce((s, i) => s + i.height, 0);
                let o = 0; imgs.forEach(i => { ctx.drawImage(i, 0, o); o += i.height; });
            }
            canvas.toBlob(b => { processedBlob = b; reviewContainer.innerHTML = `<img src="${URL.createObjectURL(b)}" style="max-width:100%; border-radius:12px">`; }, 'image/jpeg', 0.9);
        }

        document.getElementById('finalDownload').onclick = async function() {
            if (selectedFileList.length === 0 && !processedBlob) return;
            
            // Local merge logic
            if (currentTool === 'imagepdf' && processedBlob) {
                const link = document.createElement('a'); 
                link.href = URL.createObjectURL(processedBlob);
                link.download = "NADIM_CONSOLIDATED.jpg"; link.click(); closeModal(); return;
            }

            status.style.display = 'block'; 
            status.innerText = "ENGAGING ENGINE...";

            try {
                const fd = new FormData();
                fd.append('tool', currentTool);
                
                if (currentTool === 'imagepdf' && processedBlob) {
                    fd.append('file', processedBlob, 'merged.jpg');
                } else {
                    // Send actual physical file binary
                    fd.append('file', selectedFileList[0]);
                }

                // Proxy authorization through Vercel
                const res = await fetch('/api/process', { method: 'POST', body: fd });
                const data = await res.json();

                if (data.status === "SUCCESS") {
                    status.innerText = "UPLOADING TO CORE...";
                    
                    // Upload directly to iLovePDF assigned server
                    const uploadFd = new FormData();
                    uploadFd.append('task', data.task);
                    uploadFd.append('file', selectedFileList[0]);

                    await fetch(`https://${data.server}/v1/upload`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${data.token}` },
                        body: uploadFd
                    });

                    status.innerText = "PROCESSING & DOWNLOADING...";
                    // Redirect to final download
                    window.location.href = `https://${data.server}/v1/download/${data.task}`;
                    
                    setTimeout(() => { status.style.display = 'none'; closeModal(); }, 5000);
                } else {
                    throw new Error(data.details || "Handshake Failed");
                }
            } catch (err) {
                console.error(err);
                status.innerText = "ENGINE ERROR: RETRY";
                setTimeout(() => status.style.display = 'none', 3000);
            }
        };
    </script>
</body>
</html>
